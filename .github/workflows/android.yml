name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK Platform (matches compileSdk = 37)
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Check docs and structure
        run: python3 scripts/check_repo.py
      - name: Gradle test, lint and debug APK
        run: ./scripts/check.sh
      - name: Publish debug APK as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pulso-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  instrumented:
    # Room, migration and backup tests on an emulator (fresh device, so connectedDebugAndroidTest is safe here).
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
